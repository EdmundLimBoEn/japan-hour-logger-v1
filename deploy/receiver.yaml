receiver:
  id: radio-pi
  name: Japan Hour Radio Pi
  locator: OJ11WH
  timezone: Asia/Singapore

input:
  source: all_txt
  path: /var/lib/radio-ft8/ALL.TXT
  poll_seconds: 1.0

udp:
  host: 127.0.0.1
  port: 2237
  multicast: false

http:
  host: 0.0.0.0
  port: 8080

database:
  url: sqlite:////var/lib/japan-hour-logger/radio.db

paths:
  data_dir: /var/lib/japan-hour-logger
  raw_dir: /var/lib/japan-hour-logger/raw/wsjtx
  exports_dir: /var/lib/japan-hour-logger/exports
  backups_dir: /var/lib/japan-hour-logger/backups
  jsonl_events: true

dedupe:
  window_seconds: 2.0

japan:
  dxcc_entities:
    - Japan
    - Ogasawara
    - Minami Torishima

analytics:
  default_bucket_minutes: 15
  display_timezone: Asia/Singapore
