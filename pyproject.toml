[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "japan-hour-logger"
version = "1.0.0"
description = "Receive-only FT8 propagation logger for the school Japan Hour experiment"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Edmund Lim" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "typer>=0.15.0",
    "pyyaml>=6.0.2",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.17",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0"]

[project.scripts]
radio-logger = "radio_logger.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
radio_logger = [
    "resources/*",
    "web/templates/*.html",
    "web/static/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
