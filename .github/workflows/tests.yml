name: tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  install-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: school 日本 & radio!
    steps:
      - uses: actions/checkout@v4
        with:
          path: school 日本 & radio!
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: school 日本 & radio!/requirements.txt
      - name: Install the pinned dependencies and build the package
        run: python -m pip install -r requirements.txt .
      - run: python -m pip check
      - run: python -m pytest -q
      - name: Verify installed assets, UDP, API, export, backup, and restart
        run: python scripts/verify-install.py
      - name: Test fresh and repeated Windows setup
        if: runner.os == 'Windows' && matrix.python == '3.12'
        shell: cmd
        run: |
          call "Setup Windows.cmd" --no-pause
          if errorlevel 1 exit /b 1
          call "Setup Windows.cmd" --no-pause
